name: Release plugin package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify the release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const p=JSON.parse(readFileSync('package.json','utf8')); if (process.env.RELEASE_TAG !== 'v' + p.version) { console.error('Release tag must be v' + p.version); process.exit(1) }"

      - name: Install, check, and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          git ls-files --error-unmatch lib/index.js
          git diff --exit-code -- lib/index.js
          pnpm pack

      - name: Upload package tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./*.tgz --clobber
